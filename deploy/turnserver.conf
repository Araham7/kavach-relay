# coturn config for Kavach (TURN relay hides users' IP addresses in calls)
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET   # same value as TURN_SECRET in kavach.env
realm=kavach.local
total-quota=100
bps-capacity=0
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
# TLS cert (same as relay)
cert=/etc/kavach/cert.pem
pkey=/etc/kavach/key.pem
# Never relay into your private network or loopback (prevents SSRF via TURN)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
# For a LAN-only/offline setup, comment the next 3 lines so peers on 192.168.x.x can be relayed
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# no logging of users
no-stdout-log
log-file=/dev/null
simple-log
