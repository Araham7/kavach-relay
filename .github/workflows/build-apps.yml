# Builds Kavach apps on GitHub's free cloud machines (Windows, Mac, Linux).
# Run it: GitHub → your repo → Actions → "Build Kavach apps" → Run workflow.
# Set once: Settings → Secrets and variables → Actions → Variables → KAVACH_URL = https://<NUC-IP>:8443
name: Build Kavach apps
on: workflow_dispatch

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: build:linux
          - os: windows-latest
            cmd: build:win
          - os: macos-latest
            cmd: build:mac
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: Kavach-desktop-${{ matrix.os }}
          path: |
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
            desktop-app/dist/*.exe
            desktop-app/dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./android-app/build-apk.sh "${{ vars.KAVACH_URL }}"
      - uses: actions/upload-artifact@v4
        with: { name: Kavach-android, path: Kavach-test.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capacitor iOS project
        run: |
          npm ci
          npm i --no-save @capacitor/ios@^6.2.0
          cat > capacitor.config.json <<JSON
          { "appId": "com.araham.kavach", "appName": "Kavach", "webDir": "www",
            "server": { "url": "${{ vars.KAVACH_URL }}", "cleartext": false } }
          JSON
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#070027' || true
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kavach needs the camera for video calls.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Kavach needs the microphone for calls and voice notes.'" ios/App/App/Info.plist
      - name: Build unsigned .ipa
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../Kavach-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Kavach-ios-unsigned, path: android-app/Kavach-unsigned.ipa }
